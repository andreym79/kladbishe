{%- set b = block.data -%}
<section id="faq" class="sec light">
<div style="max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
{% if b.title %}{{ m.h2(b.title) }}
{% endif %}<div style="display: flex; flex-direction: column; border-top: 1px solid #1F1F1F">
{% for q in b['items'] or [] %}<details style="border-bottom: 1px solid #D9D3C7; padding: 24px 0"><summary style="display: flex; justify-content: space-between; gap: 24px; font-weight: 600; font-size: 20px">{{ q.question }}<span class="faq-plus" style="font-size: 28px; line-height: 1; transition: transform .2s">+</span></summary><p style="margin: 16px 0 0; color: #5C5850">{{ (q.answer or '') | nl2br }}</p></details>
{% endfor %}</div>
</div>
</section>
