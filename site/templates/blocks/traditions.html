{%- set b = block.data -%}
<section id="traditions" class="sec light">
<div style="max-width: 1200px; margin: 0 auto; background: #FBFAF7; border: 1px solid #E3DED4; border-radius: 8px; padding: clamp(32px, 5vw, 72px); display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 720px">
{% if b.title %}{{ m.h2(b.title) }}
{% endif %}{% if b.text %}<p style="margin: 0; color: #5C5850">{{ b.text | nl2br }}</p>
{% endif %}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 40px">
{% for g in b.groups or [] %}<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-weight: 700; font-size: 20px">{{ g.title }}</div>
{% for it in g['items'] or [] %}<div style="color: #3A3833">{{ it.text }}</div>
{% endfor %}</div>
{% endfor %}</div>
</div>
</section>
