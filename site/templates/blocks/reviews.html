{%- set b = block.data -%}
<section id="reviews" class="sec light">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
{% if b.title %}{{ m.h2(b.title) }}
{% endif %}<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 24px">
{% for r in b['items'] or [] %}<figure style="margin: 0; background: #FBFAF7; border: 1px solid #E3DED4; border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<blockquote style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; line-height: 1.35">«{{ r.text | nl2br }}»</blockquote>
<figcaption style="display: flex; align-items: center; gap: 14px; margin-top: auto">
{% if r.photo %}{{ m.picture(r.photo, alt='', sizes='56px', width=56, height=56, style='width: 56px; height: 56px; border-radius: 999px; object-fit: cover; flex-shrink: 0') }}{% endif %}
<span style="display: flex; flex-direction: column"><span style="font-weight: 700">{{ r.name }}</span>{% if r.place %}<span style="color: #5C5850; font-size: 15px">{{ r.place }}</span>{% endif %}</span>
</figcaption>
</figure>
{% endfor %}</div>
</div>
</section>
