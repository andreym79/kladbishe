{#- Order dialog: the tariffs come from the «Цены» block. -#}
<!-- Форма заказа -->
<div id="order-overlay" hidden style="position: fixed; inset: 0; z-index: 50; background: rgba(20,20,20,0.78); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px">
<div role="dialog" aria-modal="true" aria-labelledby="order-title" style="position: relative; width: 100%; max-width: 520px; margin: auto; background: #FBFAF7; border-radius: 16px; padding: clamp(28px, 5vw, 44px); color: #1F1F1F">
<button type="button" class="js-close" aria-label="Закрыть" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D9D3C7; background: #F4F1EB; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>

<form id="order-form" novalidate style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px; padding-right: 40px">
<h2 id="order-title" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 36px; line-height: 1.1">Оформить заказ</h2>
<p style="margin: 0; color: #5C5850; font-size: 16px">Ответим в течение 15 минут</p>
</div>
<div class="of-field"><label for="of-name">Фамилия и имя</label><input id="of-name" name="name" class="of-input" type="text" autocomplete="name" maxlength="120" placeholder="Как к вам обращаться"></div>
<div class="of-field"><label for="of-phone">Телефон</label><input id="of-phone" name="phone" class="of-input" type="tel" autocomplete="tel" maxlength="40" placeholder="+972 50 000-0000"></div>
<div class="of-field"><label for="of-cem">Кладбище</label><input id="of-cem" name="cemetery" class="of-input" type="text" maxlength="200" placeholder="Например, Востряковское, участок 12"></div>
<div class="of-field"><label for="of-grave">Имя на могиле</label><input id="of-grave" name="grave" class="of-input" type="text" maxlength="200" placeholder="ФИО и годы жизни"></div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-weight: 700; font-size: 17px; padding: 0; margin-bottom: 10px">Тариф</legend>
{% for t in tariffs %}<label class="of-radio"><input type="radio" name="tariff" value="{{ t.key }}"><span class="of-dot"></span><span class="of-rlabel">{{ t.name }}</span><span class="of-price">{{ t.price_text }}</span></label>
{% endfor %}</fieldset>
<div class="of-field"><label for="of-info">Дополнительно</label><textarea id="of-info" name="info" class="of-input" rows="4" maxlength="1500" placeholder="Даты, пожелания: цветы или камни, состояние памятника" style="min-height: 0; padding: 14px 18px; line-height: 1.5; resize: vertical"></textarea></div>
<input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0">
<div id="order-error" role="alert" hidden style="padding: 12px 16px; border-radius: 10px; background: #F6E3DF; color: #8A2A1B; font-size: 16px"></div>
<button type="submit" id="order-submit" style="min-height: 56px; border-radius: 999px; border: none; background: #0038B8; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Отправить</button>
</form>

<div id="order-success" hidden style="flex-direction: column; gap: 18px; align-items: flex-start; padding: 12px 40px 0 0">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 36px; line-height: 1.1">Спасибо, заказ принят</h2>
<p style="margin: 0; color: #5C5850">Мы свяжемся с вами в течение 15 минут, чтобы уточнить детали и прислать ссылку на оплату.</p>
<button type="button" class="js-close" style="min-height: 52px; padding: 0 28px; border-radius: 999px; border: 1px solid #1F1F1F; background: transparent; color: #1F1F1F; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer">Закрыть</button>
</div>
</div>
</div>
